databaseChangeLog:
  - changeSet:
      id: 001-create-tables
      author: admin
      changes:
        - createSequence:
            sequenceName: category_seq
            startValue: 1
            incrementBy: 1
        - createSequence:
            sequenceName: product_seq
            startValue: 1
            incrementBy: 1
        - createSequence:
            sequenceName: customer_order_seq
            startValue: 1
            incrementBy: 1
        - createSequence:
            sequenceName: order_item_seq
            startValue: 1
            incrementBy: 1

        - createTable:
            tableName: categories
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

        - createTable:
            tableName: products
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: VARCHAR(1023)
              - column:
                  name: price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
                    checkConstraint: price > 0
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
                    checkConstraint: quantity >= 0
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - createTable:
            tableName: customer_orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_number
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

        - createTable:
            tableName: order_items
            columns:
              - column:
                  name: id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: product_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: quantity
                  type: INT
                  constraints:
                    nullable: false
                    checkConstraint: quantity > 0
              - column:
                  name: unit_price
                  type: DECIMAL(10,2)
                  constraints:
                    nullable: false
                    checkConstraint: unit_price > 0